name: Avatar Intelligence bridge
on:
  pull_request:
    paths:
      - 'tools/generate_3d.py'
      - 'tools/test_generate_3d.py'
      - '.github/workflows/avatar-intelligence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/generate_3d.py
      - run: python -m unittest discover -s tools -p test_generate_3d.py
