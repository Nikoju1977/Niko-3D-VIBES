name: Niko 3D Vibes Quality Gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-secrets.py
      - run: python3 scripts/test-private-publish.py
      - run: npm test
      - run: npm run check
      - run: python3 scripts/verify.py
      - run: npm run build
      - run: npm run integrity:verify
      - run: python -m pip install playwright==1.51.0
      # Ubuntu hosted runners include Chromium system libraries. Avoid unrelated apt repositories.
      # Browser smoke tests remain mandatory and fail if runtime libraries are absent.
      - run: python -m playwright install chromium
      - run: python scripts/browser_smoke.py
      - run: python scripts/webgl_smoke.py
